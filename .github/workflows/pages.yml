# Statische Fassung der Seite auf GitHub Pages: https://jmp-collab.github.io/ai-directories/
# Einmalig nötig: Settings → Pages → Source „GitHub Actions“.
name: GitHub Pages

on:
    push:
        branches: [main]
    # Täglicher Neubau: Deal und Tool des Tages wechseln, Datumsangaben bleiben frisch.
    schedule:
        - cron: '17 4 * * *'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            # Partner-Register prüfen: falscher Slug oder kaputter Link bricht den Build ab
            - run: npm run partners
            # Next.js 14 kann Vorschaubilder unter [slug] nicht statisch exportieren;
            # die Detailseiten nutzen in dieser Fassung das allgemeine Vorschaubild.
            - run: rm "app/verzeichnis/[slug]/opengraph-image.js"
            - run: npx next build
              env:
                  STATIC_EXPORT: '1'
                  BASE_PATH: /ai-directories
                  NEXT_PUBLIC_SITE_URL: https://jmp-collab.github.io/ai-directories
                  # Optional als Repository-Variablen setzen (Settings > Secrets and variables > Actions > Variables)
                  NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
                  NEXT_PUBLIC_LEAD_EMAIL: ${{ vars.LEAD_EMAIL }}
                  NEXT_PUBLIC_LEAD_ALIAS: ${{ vars.LEAD_ALIAS }}
            # Vorschaubilder als .png und doppelten basePath in og:image korrigieren
            - run: node utils/export/fix-og.js
              env:
                  BASE_PATH: /ai-directories
            - run: touch out/.nojekyll
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
